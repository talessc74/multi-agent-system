name: Deploy — Produção

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy eai-producao
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_PROD }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker para GCR
        run: gcloud auth configure-docker --quiet

      - name: Copiar agents/ e registry/ para o contexto de build
        run: |
          cp -r agents lexforum-ai-studio/
          cp -r registry lexforum-ai-studio/

      - name: Build da imagem Docker
        run: |
          docker build \
            --build-arg VITE_GIT_HASH=$(git rev-parse --short=6 HEAD) \
            -t gcr.io/gen-lang-client-0982741688/eai-producao:${{ github.sha }} \
            -t gcr.io/gen-lang-client-0982741688/eai-producao:latest \
            ./lexforum-ai-studio

      - name: Push para GCR
        run: docker push --all-tags gcr.io/gen-lang-client-0982741688/eai-producao

      - name: Deploy para Cloud Run
        run: |
          gcloud run deploy eai-producao \
            --image=gcr.io/gen-lang-client-0982741688/eai-producao:${{ github.sha }} \
            --region=us-east1 \
            --project=gen-lang-client-0982741688 \
            --platform=managed \
            --allow-unauthenticated \
            --quiet
