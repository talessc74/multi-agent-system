name: CI — Testes

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Vitest (lexforum-ai-studio)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: lexforum-ai-studio/package-lock.json

      - name: Instalar dependências
        run: npm ci
        working-directory: lexforum-ai-studio

      - name: Rodar testes
        run: npm test -- --run
        working-directory: lexforum-ai-studio
